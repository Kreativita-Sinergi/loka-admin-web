<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d5df3" />
    <title>Koneksi terputus · Loka Admin</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background: #e6eaf0;
        color: #0f172a;
        font: 16px/1.55 system-ui, sans-serif;
      }
      main { width: min(100%, 380px); padding: 24px; border: 1px solid #cfd7e1; border-radius: 20px; background: #f1f4f8; }
      h1 { margin: 0; font-size: 1.375rem; line-height: 1.25; }
      p { margin: 12px 0 20px; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 10px; background: #0d5df3; color: #fff; font-weight: 600; text-decoration: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1220; color: #f1f5f9; }
        main { background: #111a2b; border-color: #232e44; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Koneksi terputus</h1>
      <p>Loka Admin memerlukan internet untuk membuka data. Sambungkan perangkat dan coba lagi.</p>
      <a href="">Coba lagi</a>
    </main>
  </body>
</html>
